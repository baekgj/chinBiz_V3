# =============================================================================
#  친비즈(ChinBiz) V3 · nginx 리버스 프록시 설정 예시
#  구조: nginx(80/443) 가 앞단에서 SSL 종단 + 라우팅, 내부 앱은 로컬 포트로만 구동
#    - https://chinbiz.kr        → home  (Next.js, 내부 8001)
#    - https://admin.chinbiz.kr  → admin (Next.js, 내부 3100)
#    - 각 도메인의 /api, /uploads → BE    (Spring Boot, 내부 9001)   ← same-origin(CORS 불필요)
#
#  설치: 이 파일을  /etc/nginx/sites-available/chinbiz.kr.conf  로 복사 후
#        ln -s /etc/nginx/sites-available/chinbiz.kr.conf /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#  ※ 내부 앱은 nginx 뒤에서 포트로만 뜨면 되므로 home 은 80이 아니라 8001 로 구동
#     (home/package.json 의 "-p 80" → "-p 8001" 로 되돌리거나 PORT 로 지정).
# =============================================================================

upstream chinbiz_home  { server 127.0.0.1:8001; keepalive 16; }
upstream chinbiz_admin { server 127.0.0.1:3100; keepalive 16; }
upstream chinbiz_api   { server 127.0.0.1:9001; keepalive 16; }

# 프록시 공통 헤더 (재사용)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ── (1) HTTP :80 → HTTPS 리다이렉트 (+ Let's Encrypt 갱신 경로 예외) ──────────
server {
    listen 80;
    listen [::]:80;
    server_name chinbiz.kr www.chinbiz.kr admin.chinbiz.kr;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── (2) HTTPS :443 · 홈 (chinbiz.kr / www) ───────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chinbiz.kr www.chinbiz.kr;

    ssl_certificate     /etc/letsencrypt/live/chinbiz.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chinbiz.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;   # 상품 이미지/제안서 업로드 여유 (BE multipart 20MB 와 맞춤)

    # API → Spring Boot (브라우저 입장 same-origin → CORS 미발생)
    location /api/ {
        proxy_pass http://chinbiz_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # 업로드 이미지 정적 서빙(BE /uploads)
    location /uploads/ {
        proxy_pass http://chinbiz_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 그 외 전부 → 홈(Next.js)
    location / {
        proxy_pass http://chinbiz_home;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;       # Next.js HMR/웹소켓
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── (3) HTTPS :443 · 어드민 (admin.chinbiz.kr) ───────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.chinbiz.kr;

    ssl_certificate     /etc/letsencrypt/live/chinbiz.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chinbiz.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://chinbiz_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /uploads/ {
        proxy_pass http://chinbiz_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://chinbiz_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

