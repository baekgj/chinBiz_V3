# 테스트 전용 datasource (main application.yml 의 서버IP 기본값을 로컬로 override).
# @SpringBootTest(contextLoads)는 실제 DB에 붙어 컨텍스트를 로드하므로, 테스트는 로컬 MySQL을 기본으로 사용한다.
# 환경변수(DB_HOST 등)를 주면 그 값을 우선 사용 → 로컬/서버 모두 유연.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chin4}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&nullCatalogMeansCurrent=true
spring.datasource.username=${DB_USER:chin4_test}
spring.datasource.password=${DB_PASSWORD:1234}
