server:
  port: 9001

spring:
  application:
    name: chinbiz-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    # 로컬 개발 기본값 — 로컬 MySQL localhost, 계정 chin4_test/1234.
    # (.env DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD 로 override 가능. 서버 배포 시 DB_HOST=175.125.94.198, DB_USER=chin4)
    # nullCatalogMeansCurrent=true : ddl-auto 가 현재 DB 스키마만 인식하도록(타 스키마 테이블 오인 방지)
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chin4}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&nullCatalogMeansCurrent=true
    username: ${DB_USER:chin4_test}
    password: "${DB_PASSWORD:1234}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# JWT 설정 (.env JWT_SECRET / JWT_EXPIRATION_MS 대응)
jwt:
  secret: "change-this-to-a-very-long-random-secret-key-at-least-32-bytes-0123456789"
  expiration-ms: 86400000

# CORS 허용 출처 (host 뒤 :* 와일드카드 — .env CORS_ORIGINS 대응)
app:
  cors:
    allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://175.125.94.198:*}
  upload-dir: uploads
